# Project requirements - user-value focused
visionAlignment: "Everything feeds the core loop: dump → AI organizes → user browses clean knowledge"

requirements:
  - id: REQ-001
    description: "User can type or paste a brain-dump in free-form text and save it instantly"
    userValue: "Zero friction capture means ideas are never lost while trying to format them"
  - id: REQ-002
    description: "AI automatically assigns each entry to one or more categories"
    userValue: "User never has to manually file notes — browsing by topic just works"
  - id: REQ-003
    description: "AI produces a short, clear summary of each entry"
    userValue: "User can scan their knowledge library quickly without re-reading raw dumps"
  - id: REQ-004
    description: "System detects and merges duplicate or near-duplicate entries"
    userValue: "The knowledge base stays clean over time without manual housekeeping"
  - id: REQ-005
    description: "User can browse entries by category and search across all notes"
    userValue: "User can find what they learned on a topic without remembering when they wrote it"
  - id: REQ-006
    description: "System works for free with no subscription required"
    userValue: "Sustainable long-term use without ongoing cost"
  - id: REQ-007
    description: "User can create a new knowledge base with a custom name using a single command or action"
    userValue: "Spinning up a new KB (e.g. cooking-wiki, dev-wiki) takes seconds, not manual setup"
  - id: REQ-008
    description: "Each knowledge base is an independent repo — fully isolated with its own name, categories, and notes"
    userValue: "User can have many separate KBs without them mixing or interfering"
  - id: REQ-009
    description: "A freshly created KB is immediately ready to use — agent instructions file, folder structure, and README all pre-configured"
    userValue: "User can start brain-dumping the moment the repo is created, with no manual config"
