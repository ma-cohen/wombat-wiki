# Design decisions for this project.
# Each decision explores multiple options with pros/cons,
# and links back to requirements via requirementRefs.
#
# notes: Free-text area for research links, analysis, constraints.

notes: |
  Core concept: any AI agent with file-write access (Claude Code, Cursor, GitHub Copilot, ChatGPT with file tools, etc.) acts as the organizer.
  Workflow: user brain-dumps in their AI agent of choice → agent reads existing notes, categorizes, writes markdown → user browses in Obsidian.
  The repo IS the knowledge base. A conventions file (AGENT.md or equivalent) defines structure and rules the agent follows every session.

decisions:
  - id: DEC-KB-001
    topic: "How does the user submit a brain-dump?"
    context: "The user wants zero-friction input. An AI agent with file access can do all the organizing."
    category: product
    requirementRefs: [REQ-001, REQ-006]
    contextRefs: [CTX-KB-001, CTX-KB-002, CTX-002]
    options:
      - id: ai-agent-chat
        title: "Type brain-dump into any AI agent with file-write access"
        description: "User opens the repo in their preferred AI coding agent (Claude Code, Cursor, Copilot, etc.) and types or pastes thoughts. The agent reads existing notes, organizes, and writes markdown files."
        pros:
          - "Zero extra tooling — user picks the agent they already use"
          - "Agent has full repo context when writing and deduplicating"
          - "Works with any agent that can read/write files"
        cons:
          - "Requires opening an agent tool (not a background daemon)"
      - id: separate-input-ui
        title: "Separate input form (web app or CLI) calling an LLM API"
        description: "A small web page or CLI tool that accepts input and calls an LLM API to process it independently of any coding agent."
        pros:
          - "Works without opening a coding agent"
          - "Could be accessed from a phone on local network"
        cons:
          - "Extra tooling to build and maintain"
          - "Requires an LLM API key and cost"
    chosen: ai-agent-chat
    chosenReason: "Any AI agent with file access already does this perfectly with zero extra setup — the user picks whichever agent they prefer and can switch at any time."

  - id: DEC-KB-002
    topic: "File structure — how is knowledge organized on disk?"
    context: "Claude needs a consistent structure to write to and read from. Affects browsability in Obsidian."
    category: data
    requirementRefs: [REQ-002, REQ-003, REQ-005]
    contextRefs: [CTX-KB-003, CTX-KB-004, CTX-KB-005]
    options:
      - id: category-folders
        title: "One folder per category, one file per note"
        description: "e.g. `dev/react-hooks-tip.md`, `ideas/startup-idea-1.md`. Each file has YAML frontmatter: title, summary, tags, date."
        pros:
          - "Browsable in Obsidian's file tree by category"
          - "Easy for Claude to find related notes (scan folder)"
          - "Clean and human-readable"
        cons:
          - "Cross-category notes need a decision (pick primary category)"
      - id: flat-with-tags
        title: "Single flat folder, all notes tagged"
        description: "All notes in one folder. Category expressed only as a tag in frontmatter."
        pros:
          - "Simpler — no folder decisions"
        cons:
          - "Harder to browse by category in Obsidian's file tree"
          - "Claude must scan all files to find related notes"
    chosen: category-folders
    chosenReason: "Folders make browsing in Obsidian's sidebar intuitive and let Claude efficiently scan only the relevant category when checking for duplicates."

  - id: DEC-KB-003
    topic: "How does the agent know the KB conventions each session?"
    context: "AI agents start fresh each session. The KB's category list, file format, and dedup rules must be discoverable without the user re-explaining every time."
    category: architecture
    requirementRefs: [REQ-002, REQ-003, REQ-004]
    contextRefs: [CTX-KB-005, CTX-KB-006]
    options:
      - id: agent-instructions-file
        title: "Agent instructions file in the repo root"
        description: "A markdown file (AGENT.md, CLAUDE.md, AGENTS.md, .cursorrules, etc.) defines: category list, frontmatter format, dedup rules. Most AI agents auto-load a file like this from the repo root."
        pros:
          - "Most AI agents (Claude Code, Cursor, Copilot) auto-load repo-root instruction files"
          - "Single source of truth — user edits one file to change behavior"
          - "Agent-agnostic: rename the file to match whatever agent you use"
          - "No extra tooling"
        cons:
          - "Different agents use different filenames (CLAUDE.md vs .cursorrules vs AGENTS.md)"
      - id: index-file
        title: "A machine-readable index file (JSON/YAML)"
        description: "An `index.json` listing all notes, categories, and summaries. Agent reads it to understand KB state without reading every file."
        pros:
          - "Compact — agent doesn't need to open every file"
          - "Agent-agnostic format"
        cons:
          - "Must be kept in sync — agent must update it on every write"
          - "Extra complexity for minimal gain at small scale"
    chosen: agent-instructions-file
    chosenReason: "An instructions file in the repo root is auto-loaded by every major AI agent tool and requires no maintenance beyond editing it when conventions change — simpler than keeping an index in sync."

  - id: DEC-KB-004
    topic: "Deduplication — how does Claude avoid writing duplicate notes?"
    context: "User brain-dumps the same idea in different words over time. Claude needs to detect and merge rather than create a second file."
    category: architecture
    requirementRefs: [REQ-004]
    contextRefs: [CTX-KB-006]
    options:
      - id: read-before-write
        title: "Claude reads the category folder before writing"
        description: "CLAUDE.md instructs Claude: before creating a new note, read all existing notes in the same category and check for overlap. If a duplicate exists, update the existing file instead."
        pros:
          - "No extra tooling — Claude's comprehension handles this"
          - "Works for paraphrased duplicates, not just exact matches"
          - "Claude can merge intelligently (combine + re-summarize)"
        cons:
          - "Slower as the category grows (more files to read)"
          - "Relies on Claude's judgment"
      - id: embeddings
        title: "Vector embeddings for similarity search"
        description: "Embed all notes and check cosine similarity on each new insert."
        pros:
          - "Scales to large vaults"
        cons:
          - "Requires an embedding model and vector store — extra setup"
          - "Overkill for a personal KB that grows slowly"
    chosen: read-before-write
    chosenReason: "For a personal KB that grows gradually, Claude reading the category folder before writing is sufficient and requires no extra infrastructure — embeddings are overkill at this scale."

  - id: DEC-KB-005
    topic: "Browsing UI — how does the user read and navigate the knowledge base?"
    context: "Markdown files in a repo need a good reading experience. Obsidian is already familiar to the user."
    category: product
    requirementRefs: [REQ-003, REQ-005]
    contextRefs: [CTX-KB-004, CTX-003]
    options:
      - id: obsidian
        title: "Open the repo folder in Obsidian as a vault"
        description: "Point Obsidian at the repo root. Get file tree by category, search, graph view, and beautiful markdown rendering for free."
        pros:
          - "User already knows Obsidian"
          - "Zero extra setup — just open the folder"
          - "Graph view shows connections between notes"
          - "Fast full-text search built in"
        cons:
          - "Separate app to open (not in the browser)"
      - id: github-web
        title: "Browse via GitHub web UI"
        description: "Push to GitHub. Browse markdown files rendered in GitHub's web UI."
        pros:
          - "Accessible from any device/browser"
          - "No extra app"
        cons:
          - "GitHub's markdown browsing is basic — no search across files"
          - "Requires a push to see changes"
    chosen: obsidian
    chosenReason: "Obsidian gives instant search, graph view, and beautiful rendering with zero setup beyond pointing it at the folder — the user already has it and it's the best free markdown browsing experience."

  - id: DEC-KB-006
    topic: "How does a user create a new KB instance?"
    context: "User wants to spin up multiple isolated KBs (e.g. dev-wiki, cooking-wiki) with a single action and a custom name."
    category: product
    requirementRefs: [REQ-007, REQ-008, REQ-009]
    contextRefs: [CTX-KB-007, CTX-KB-008, CTX-KB-009, CTX-004]
    options:
      - id: github-template
        title: "GitHub template repo — 'Use this template' button or gh CLI"
        description: "Mark this repo as a GitHub template. User creates a new KB via the GitHub UI ('Use this template' → enter name) or with one CLI command: `gh repo create my-kb --template owner/wombat-wiki --clone`."
        pros:
          - "Zero extra tooling — built into GitHub"
          - "gh CLI gives a true one-liner with local clone included"
          - "New repo is fully isolated on GitHub from day one"
          - "Free, no package to maintain"
        cons:
          - "Requires a GitHub account"
          - "gh CLI must be installed for the command-line path"
      - id: npm-create
        title: "npm create package (npx create-wombat-wiki my-kb)"
        description: "A small published npm package that scaffolds the folder structure, writes the agent instructions file, and inits a local git repo."
        pros:
          - "Standard developer pattern — discoverable and familiar"
          - "Works fully offline after first use"
          - "Can prompt the user for name, categories, preferred agent"
        cons:
          - "Requires publishing and maintaining an npm package"
          - "Adds a dependency (npm/node)"
      - id: degit
        title: "degit one-liner (npx degit owner/wombat-wiki my-kb)"
        description: "User runs `npx degit owner/wombat-wiki my-kb` to clone the template without git history, then inits their own repo."
        pros:
          - "No package to maintain — just the source repo"
          - "No GitHub account needed for the consumer"
        cons:
          - "Less discoverable than a named create package"
          - "User must manually run git init and set remote"
    chosen: github-template
    chosenReason: "GitHub template repos require zero extra tooling and the gh CLI one-liner (`gh repo create my-kb --template owner/wombat-wiki --clone`) is a single command that creates the repo, sets up GitHub, and clones locally — perfect for a free, low-maintenance solution."

  - id: DEC-KB-007
    topic: "What does the template repo contain at creation time?"
    context: "A freshly created KB must be immediately usable — the agent needs instructions and the folder structure must exist."
    category: architecture
    parentDecisionRef: DEC-KB-006
    requirementRefs: [REQ-009, REQ-003]
    contextRefs: [CTX-KB-005, CTX-KB-003]
    options:
      - id: minimal-scaffold
        title: "Minimal scaffold: agent instructions file + placeholder category folders + README"
        description: "Template contains: CLAUDE.md (agent instructions), one placeholder .gitkeep per default category folder, and a README explaining the workflow. Nothing else."
        pros:
          - "User is ready to dump immediately after clone"
          - "Clean — no example notes cluttering the new KB"
          - "README explains the workflow for any AI agent"
        cons:
          - "User must open their agent and start — no example to copy"
      - id: scaffold-with-examples
        title: "Scaffold with example notes included"
        description: "Template includes a few example markdown notes per category so the user can see the expected format immediately."
        pros:
          - "User can see exactly what a good note looks like"
        cons:
          - "Example notes pollute the new KB — user must delete them"
          - "Examples become outdated if format changes"
    chosen: minimal-scaffold
    chosenReason: "A minimal scaffold with the agent instructions file and empty category folders is enough to start immediately — example notes add clutter the user has to clean up, and the README explains the format."
